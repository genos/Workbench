[project]
name = "jax-vs-usearch"
version = "0.3.0"
description = "Comparing jax & usearch for L2 nearest neighbor search."
readme = "README.md"
authors = [
    { name = "Graham Enos", email = "graham.enos@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jax>=0.11.1",
    "usearch>=2.26.4",
]

[dependency-groups]
dev = [
    "pandas>=3.0.6",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "ruff>=0.17.0",
    "seaborn>=0.13.2",
    "ty>=0.0.86",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
